---
input:
  type: RosInput
  tf_verbosity: 1
  clear_queue_on_fail: true
  tf_lookup:
    wait_duration_s: 0.1
    max_tries: 20
    verbosity: 1
  inputs:
    left_cam:
      receiver:
        type: ClosedSetImageReceiver
        # HOI4D is 15 fps; 0.067 s keeps nominal rate while tolerating bag jitter
        input_separation_s: 0.067
      sensor:
        type: camera_info
        min_range: 0.25
        max_range: 8.0
        extrinsics:
          type: ros
          robot_frame: os1
