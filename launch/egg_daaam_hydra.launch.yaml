---
launch:
  # 'true' keeps every dataset launch exactly as before. A LIVE robot publishes no
  # /clock, so a live run MUST pass use_sim_time:=false — otherwise every node's
  # clock stays at 0 and every Hydra TF lookup fails against a frozen stamp.
  - arg: {name: use_sim_time, default: 'true', description: set false for live sensors (no /clock publisher)}
  - set_parameter: {name: use_sim_time, value: $(var use_sim_time)}

  - arg: {name: debug, default: 'false'}
  - arg: {name: verbosity, default: '0'}
  - arg: {name: glog_level, default: '0'}
  - arg: {name: print_missing, default: 'false', description: have config utilities print all missing parameters when parsing configs}

  - arg: {name: scene, default: egg_batch_1, description: scene name}
  - arg: {name: log_path, default: '', description: directory to output to}
  - arg: {name: exit_after_clock, default: 'true', description: shutdown hydra node after a rosbag finishes playing}

  - arg: {name: depth_scale, default: '1000.0', description: depth image scale factor (e.g. 1000 for mm to m)}
  - arg: {name: sync_tolerance, default: '0.25'}
  - arg: {name: defer_dsg_processing, default: 'true', description: Defer DSG processing until shutdown for performance}
  - arg: {name: dsg_update_min_interval_s, default: '0.0', description: 'min seconds between Hydra graph updates processed by the node (newest wins); 0 = every update'}
  - arg: {name: cmc_method, default: ecc, description: 'BoT-SORT camera motion compensation: ecc | orb | sof | sift | none (identity warp, fixed camera)'}
  - arg: {name: human_mask_policy, default: keep, description: 'person masks: keep | override | tag (experiments/human-mask-policy)'}
  - arg: {name: human_clip_trigger, default: detector, description: 'clip recorder trigger: detector (own YOLO) | shared (pipeline person segmenter)'}

  - arg: {name: robot_id, default: '0', description: unique robot identifier}
  - arg: {name: sensor_frame, default: cam0_optical_frame, description: camera optical frame}
  - arg: {name: robot_frame, default: os1, description: robot body tf frame}
  - arg: {name: odom_frame, default: world, description: odometry frame}
  - arg: {name: map_frame, default: map, description: backend scene graph frame}

  - arg: {name: hydra_config_path, default: $(find-pkg-share percorso_perception_ros)/config/hydra_config/egg_dataset_khronos_dynamic.yaml}
  - arg: {name: input_config_path, default: $(find-pkg-share percorso_perception_ros)/config/hydra_ros_config/egg_dataset_input_config.yaml}
  - arg: {name: lcd_config_path, default: $(find-pkg-share hydra)/config/lcd/uhumans2.yaml}
  - arg: {name: enable_lcd, default: 'false'}
  - arg: {name: bounding_box_type, default: OBB}

  - arg: {name: rgb_topic, default: /cam0/rgb_image}
  - arg: {name: rgb_info_topic, default: /cam0/camera_info}
  - arg: {name: depth_topic, default: /cam0/depth_image}
  - arg: {name: label_topic, default: /segmentation/image_raw}
  - arg: {name: colored_label_topic, default: /segmentation/color/image_raw}
  - arg: {name: odom_topic, default: '/none'}

  - arg: {name: labelspace_path, default: $(find-pkg-share percorso_perception_ros)/config/labels_pseudo.yaml}
  - arg: {name: labelspace_colors, default: $(find-pkg-share percorso_perception_ros)/config/labels_pseudo.csv}

  - arg: {name: query_interval_frames, default: '120'}
  - arg: {name: min_obs_per_track, default: '8'}
  - arg: {name: multi_image_min_n_masks, default: '32'}
  - arg: {name: min_mask_region_area, default: '400'}
  - arg: {name: max_mask_region_area, default: '307200'}
  - arg: {name: depth_lb, default: '0.05'}
  - arg: {name: depth_ub, default: '20.0'}

  - arg: {name: assignment_worker, default: 'min_frames_max_size'}
  - arg: {name: grounding_worker, default: 'dam_multi_image'}
  - arg: {name: num_assignment_workers, default: '1'}
  - arg: {name: num_grounding_workers, default: '1'}

  - arg: {name: sam_model, default: ''}
  - arg: {name: sam_model_config_path, default: ''}
  - arg: {name: sam_imgsz, default: ''}
  - arg: {name: selectframe_clip_backend, default: 'pe'}
  - arg: {name: selectframe_clip_model_name, default: 'PE-Core-L14-336'}
  - arg: {name: cuda_device, default: '', description: 'CUDA device for grounding workers (empty=inherit env, "0", "1", etc.)'}

  - arg: {name: enable_zmq, default: 'false'}
  - arg: {name: zmq_url, default: 'tcp://127.0.0.1:8001'}
  - arg: {name: zmq_send_mesh, default: 'false'}
  - arg: {name: output_run_prefix, default: ''}
  - arg: {name: save_human_clips, default: 'false'}
  - arg: {name: human_clip_detector_weights, default: 'yolo11n.pt'}
  - arg: {name: egocentric, default: 'false'}
  - arg: {name: human_clip_detector_conf, default: '0.25'}
  - arg: {name: human_clip_detector_device, default: ''}
  - arg: {name: human_clip_min_frames, default: '4'}
  - arg: {name: human_clip_max_clip_sec, default: '8.0'}
  - arg: {name: human_clip_output_fps, default: '4.0'}
  - arg: {name: human_clip_context_sec, default: '1.0'}
  - arg: {name: enable_cosmos_hoi_processing, default: 'false'}
  - arg: {name: captioner, default: '', description: "'' = pipeline_config workers.dam_grounding_config.captioner; dam | cosmos | dam+cosmos_shadow"}
  - arg: {name: cosmos_caption_region, default: '', description: "'' = pipeline_config value; box | crop | box+crop"}
  - arg: {name: cosmos_hoi_base_url, default: 'http://localhost:8000/v1'}
  - arg: {name: cosmos_hoi_model, default: 'cosmos-reason2'}
  - arg: {name: cosmos_hoi_api_key, default: 'EMPTY'}
  - arg: {name: cosmos_hoi_media_root, default: ''}
  - arg: {name: cosmos_hoi_fps, default: '4.0'}
  - arg: {name: cosmos_hoi_enrich_pass1_location, default: 'false'}
  - arg: {name: cosmos_hoi_match_iou_threshold, default: '0.1'}
  - arg: {name: cosmos_hoi_streaming, default: 'false'}
  # Latency options (off = paper path); see daaam CosmosHOIConfig.
  - arg: {name: cosmos_hoi_video_sampling, default: 'processor'}
  - arg: {name: cosmos_hoi_pass1_input, default: 'mp4'}
  - arg: {name: cosmos_hoi_early_pass2, default: 'false'}
  - arg: {name: cosmos_hoi_stream_fps, default: '2.0'}
  - arg: {name: cosmos_hoi_stream_warmup_interval_sec, default: '1.0'}
  - arg: {name: enable_semantic_event_post_processing, default: 'true'}
  - arg: {name: semantic_event_output_name, default: 'events_semantic.yaml'}
  - arg: {name: semantic_event_neighbor_window_sec, default: '8.0'}
  - arg: {name: semantic_event_confidence_threshold, default: '0.65'}

  # live demo: rolling recent-history buffer + HTTP bridge (off by default). The
  # mid-run rebuild of events.yaml has no switch of its own: it runs whenever
  # defer_dsg_processing is false and Cosmos HOI is on.
  - arg: {name: enable_live_hoi_query, default: 'false', description: rolling buffer + query bridge}
  - arg: {name: live_buffer_sec, default: '30.0'}
  - arg: {name: live_snapshot_keep, default: '5'}
  - arg: {name: live_bridge_host, default: '0.0.0.0'}
  - arg: {name: live_bridge_port, default: '8100'}
  - arg: {name: enable_live_query_router, default: 'false', description: 'POST /ask picks dsg/interactions/events/video itself'}
  - arg: {name: live_query_router_model, default: '', description: "'' = human_reason.semantic_events.llm_model from pipeline_config"}
  - arg: {name: live_query_router_base_url, default: ''}
  - arg: {name: live_query_router_api_key, default: ''}
  - arg: {name: live_query_router_max_iterations, default: '6', description: 'tool-call round-trips before forcing an answer; lower than the offline default (15) to bound live latency'}
  - arg: {name: live_query_router_tools, default: '', description: 'comma-separated tool names to restrict /ask to; empty = all tools'}
  - arg: {name: event_refresh_interval_sec, default: '120.0', description: 'mid-run events.yaml rebuild interval; only when defer_dsg_processing is false and Cosmos HOI is on'}

  - set_remap: {from: hydra_visualizer/dsg, to: hydra/backend/dsg}

  - include:
      file: $(find-pkg-share percorso_perception_ros)/launch/daaam_node.launch.yaml
      arg:
        - {name: rgb_topic, value: $(var rgb_topic)}
        - {name: depth_topic, value: $(var depth_topic)}
        - {name: camera_info_topic, value: $(var rgb_info_topic)}
        - {name: dsg_update_topic, value: '/hydra/backend/dsg'}
        - {name: segmentation_topic, value: $(var label_topic)}
        - {name: segmentation_color_topic, value: $(var colored_label_topic)}

        - {name: depth_scale, value: $(var depth_scale)}
        - {name: world_frame, value: $(var odom_frame)}
        - {name: camera_frame, value: $(var sensor_frame)}

        - {name: semantic_config, value: $(var labelspace_path)}
        - {name: labelspace_colors, value: $(var labelspace_colors)}

        - {name: sam_model, value: $(var sam_model)}
        - {name: sam_model_config_path, value: $(var sam_model_config_path)}
        - {name: sam_imgsz, value: $(var sam_imgsz)}
        - {name: sentence_embedding_model, value: ""}
        - {name: compute_full_image_description, value: 'true'}
        - {name: captioner, value: $(var captioner)}
        - {name: cosmos_caption_region, value: $(var cosmos_caption_region)}

        - {name: depth_lb, value: $(var depth_lb)}
        - {name: depth_ub, value: $(var depth_ub)}
        - {name: query_interval_frames, value: $(var query_interval_frames)}
        - {name: num_assignment_workers, value: $(var num_assignment_workers)}
        - {name: num_grounding_workers, value: $(var num_grounding_workers)}
        - {name: min_mask_region_area, value: $(var min_mask_region_area)}
        - {name: max_mask_region_area, value: $(var max_mask_region_area)}

        - {name: assignment_worker, value: $(var assignment_worker)}
        - {name: grounding_worker, value: $(var grounding_worker)}
        - {name: min_obs_per_track, value: $(var min_obs_per_track)}
        - {name: multi_image_min_n_masks, value: $(var multi_image_min_n_masks)}
        - {name: save_debug_data, value: 'false'}
        - {name: save_grounding_images, value: 'false'}
        - {name: save_plain_grounding_images, value: 'false'}
        - {name: save_object_images, value: 'false'}

        - {name: selectframe_clip_backend, value: $(var selectframe_clip_backend)}
        - {name: selectframe_clip_model_name, value: $(var selectframe_clip_model_name)}

        - {name: dataset_name, value: 'egg'}

        - {name: reid_weights, value: 'checkpoints/reid_weights/clip_general.engine'}
        - {name: with_reid, value: 'true'}
        - {name: reid_half, value: 'false'}
        - {name: cmc_method, value: $(var cmc_method)}
        - {name: human_mask_policy, value: $(var human_mask_policy)}
        - {name: human_clip_trigger, value: $(var human_clip_trigger)}

        - {name: enable_debug_output, value: 'true'}
        - {name: output_dir, value: 'output/egg'}
        - {name: output_run_prefix, value: $(var output_run_prefix)}
        - {name: defer_dsg_processing, value: $(var defer_dsg_processing)}
        - {name: dsg_update_min_interval_s, value: $(var dsg_update_min_interval_s)}
        - {name: cuda_device, value: $(var cuda_device)}
        - {name: save_human_clips, value: $(var save_human_clips)}
        - {name: human_clip_detector_weights, value: $(var human_clip_detector_weights)}
        - {name: human_clip_detector_conf, value: $(var human_clip_detector_conf)}
        - {name: human_clip_detector_device, value: $(var human_clip_detector_device)}
        - {name: human_clip_min_frames, value: $(var human_clip_min_frames)}
        - {name: human_clip_max_clip_sec, value: $(var human_clip_max_clip_sec)}
        - {name: human_clip_output_fps, value: $(var human_clip_output_fps)}
        - {name: human_clip_context_sec, value: $(var human_clip_context_sec)}
        - {name: egocentric, value: $(var egocentric)}
        - {name: enable_cosmos_hoi_processing, value: $(var enable_cosmos_hoi_processing)}
        - {name: cosmos_hoi_base_url, value: $(var cosmos_hoi_base_url)}
        - {name: cosmos_hoi_model, value: $(var cosmos_hoi_model)}
        - {name: cosmos_hoi_api_key, value: $(var cosmos_hoi_api_key)}
        - {name: cosmos_hoi_media_root, value: $(var cosmos_hoi_media_root)}
        - {name: cosmos_hoi_fps, value: $(var cosmos_hoi_fps)}
        - {name: cosmos_hoi_enrich_pass1_location, value: $(var cosmos_hoi_enrich_pass1_location)}
        - {name: cosmos_hoi_match_iou_threshold, value: $(var cosmos_hoi_match_iou_threshold)}
        - {name: cosmos_hoi_streaming, value: $(var cosmos_hoi_streaming)}
        - {name: cosmos_hoi_video_sampling, value: $(var cosmos_hoi_video_sampling)}
        - {name: cosmos_hoi_pass1_input, value: $(var cosmos_hoi_pass1_input)}
        - {name: cosmos_hoi_early_pass2, value: $(var cosmos_hoi_early_pass2)}
        - {name: cosmos_hoi_stream_fps, value: $(var cosmos_hoi_stream_fps)}
        - {name: cosmos_hoi_stream_warmup_interval_sec, value: $(var cosmos_hoi_stream_warmup_interval_sec)}
        - {name: enable_semantic_event_post_processing, value: $(var enable_semantic_event_post_processing)}
        - {name: semantic_event_output_name, value: $(var semantic_event_output_name)}
        - {name: semantic_event_neighbor_window_sec, value: $(var semantic_event_neighbor_window_sec)}
        - {name: semantic_event_confidence_threshold, value: $(var semantic_event_confidence_threshold)}
        - {name: enable_live_hoi_query, value: $(var enable_live_hoi_query)}
        - {name: live_buffer_sec, value: $(var live_buffer_sec)}
        - {name: live_snapshot_keep, value: $(var live_snapshot_keep)}
        - {name: live_bridge_host, value: $(var live_bridge_host)}
        - {name: live_bridge_port, value: $(var live_bridge_port)}
        - {name: enable_live_query_router, value: $(var enable_live_query_router)}
        - {name: live_query_router_model, value: $(var live_query_router_model)}
        - {name: live_query_router_base_url, value: $(var live_query_router_base_url)}
        - {name: live_query_router_api_key, value: $(var live_query_router_api_key)}
        - {name: live_query_router_max_iterations, value: $(var live_query_router_max_iterations)}
        - {name: live_query_router_tools, value: $(var live_query_router_tools)}
        - {name: event_refresh_interval_sec, value: $(var event_refresh_interval_sec)}

  - set_remap: {from: /hydra/meta_data_in, to: /daaam_node/semantic_updates}

  - node:
      sigterm_timeout: 40.0
      sigkill_timeout: 70.0
      pkg: hydra_ros
      exec: hydra_ros_node
      name: hydra
      on_exit: shutdown
      launch-prefix: $(if $(var debug) 'gdbserver localhost:3000')
      env:
        - {name: TERM, value: xterm-256color}
      remap:
        - {from: hydra/input/left_cam/depth_registered/image_rect, to: $(var depth_topic)}
        - {from: hydra/input/left_cam/rgb/image_raw, to: $(var rgb_topic)}
        - {from: hydra/input/left_cam/rgb/camera_info, to: $(var rgb_info_topic)}
        - {from: hydra/input/left_cam/semantic/image_raw, to: $(var label_topic)}
      args: >
        --config-utilities-file $(var input_config_path)
        --config-utilities-file $(var hydra_config_path)
        --config-utilities-file $(var labelspace_path)
        --config-utilities-file $(var lcd_config_path)
        --config-utilities-file $(find-pkg-share hydra_ros)/config/sinks/mesh_segmenter_sinks.yaml@frontend/objects
        --config-utilities-file $(find-pkg-share hydra_ros)/config/sinks/gvd_places_sinks.yaml@frontend/freespace_places
        --config-utilities-file $(find-pkg-share hydra_ros)/config/sinks/active_window_sinks.yaml@active_window
        --config-utilities-yaml {exit_after_clock: $(var exit_after_clock), log_path: $(var log_path)}
        --config-utilities-yaml {print_missing: $(var print_missing), glog_level: $(var glog_level), verbosity: $(var verbosity)}
        --config-utilities-yaml {robot_id: $(var robot_id), odom_frame: $(var odom_frame), robot_frame: $(var robot_frame), map_frame: $(var map_frame)}
        --config-utilities-yaml {enable_zmq: $(var enable_zmq), backend: {zmq_sink: {url: $(var zmq_url), send_mesh: $(var zmq_send_mesh)}}}
        --config-utilities-yaml {frontend: {objects: {bounding_box_type: $(var bounding_box_type)}}}
        --config-utilities-yaml {enable_lcd: $(var enable_lcd)}
