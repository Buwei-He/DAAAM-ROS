---
launch:
  # Topic arguments
  - arg: {name: rgb_topic, default: '/tesse/left_cam/rgb/image_raw'}
  - arg: {name: depth_topic, default: '/tesse/left_cam/depth/image_raw'}
  - arg: {name: camera_info_topic, default: '/tesse/left_cam/camera_info'}
  - arg: {name: dsg_update_topic, default: '/hydra/backend/dsg'}
  - arg: {name: segmentation_topic, default: '/segmentation/image_raw'}
  - arg: {name: segmentation_color_topic, default: '/segmentation/color/image_raw'}

  # ROS2 node parameters
  - arg: {name: depth_scale, default: '1.0'}
  - arg: {name: sync_tolerance, default: '0.033'} # 33ms tolerance for approx 30fps
  - arg: {name: world_frame, default: 'world'}
  - arg: {name: camera_frame, default: 'dominic/forward_link'}

  # Configuration file arguments
  - arg: {name: pipeline_config, default: 'config/pipeline_config.yaml'}
  - arg: {name: semantic_config, default: $(find-pkg-share percorso_perception_ros)/config/labels_pseudo.yaml}
  - arg: {name: labelspace_colors, default: $(find-pkg-share percorso_perception_ros)/config/labels_pseudo.csv}

  # Model configuration arguments
  - arg: {name: agent_model_name, default: 'gpt-4.1'}
  - arg: {name: sam_model, default: ''}
  - arg: {name: sam_model_config_path, default: ''}
  - arg: {name: sam_imgsz, default: ''}  # Empty string for auto, or '1024,1248' for TensorRT (height,width)
  - arg: {name: sentence_embedding_model, default: "sentence-transformers/sentence-t5-xl"} # Qwen/Qwen3-Embedding-4B
  - arg: {name: compute_full_image_description, default: 'true'}

  # Processing parameters
  - arg: {name: query_interval_frames, default: '60'}
  - arg: {name: num_assignment_workers, default: '1'}
  - arg: {name: num_grounding_workers, default: '4'}
  - arg: {name: assignment_worker, default: 'min_frames_max_size'}
  - arg: {name: grounding_worker, default: 'dam_multi_image'}
  - arg: {name: min_mask_region_area, default: '300'}
  - arg: {name: defer_dsg_processing, default: 'false', description: Defer DSG processing until shutdown for performance}

  # Worker-specific parameters
  - arg: {name: min_obs_per_track, default: '6'}
  - arg: {name: save_debug_data, default: 'false'}
  - arg: {name: multi_image_min_n_masks, default: '-1'}
  - arg: {name: save_grounding_images, default: 'false'}
  - arg: {name: save_plain_grounding_images, default: 'false'}
  - arg: {name: save_object_images, default: 'false'}
  - arg: {name: selectframe_clip_backend, default: 'openclip'}  # "openclip" or "pe" (Perception Encoder)
  - arg: {name: selectframe_clip_model_name, default: 'ViT-L-14'}  # Model name for CLIP backend
  - arg: {name: cuda_device, default: '', description: 'CUDA device for grounding workers (empty=inherit env, "0", "1", etc.)'}

  # Depth filtering arguments
  - arg: {name: depth_lb, default: '0.25'}
  - arg: {name: depth_ub, default: '5.0'}

  # Tracking arguments
  - arg: {name: reid_weights, default: 'checkpoints/reid_weights/clip_general.engine'}
  - arg: {name: with_reid, default: 'true'}

  # Debug and output arguments
  - arg: {name: enable_debug_output, default: 'true'}
  - arg: {name: output_dir, default: 'output'}
  - arg: {name: output_run_prefix, default: ''}
  - arg: {name: save_human_clips, default: 'false'}
  - arg: {name: human_clip_detector_weights, default: 'yolo11n.pt'}
  - arg: {name: human_clip_detector_conf, default: '0.25'}
  - arg: {name: human_clip_detector_device, default: ''}
  - arg: {name: human_clip_min_frames, default: '4'}
  - arg: {name: human_clip_max_clip_sec, default: '8.0'}
  - arg: {name: human_clip_output_fps, default: '4.0'}
  - arg: {name: human_clip_context_sec, default: '1.0'}
  - arg: {name: egocentric, default: 'false'}
  - arg: {name: enable_cosmos_hoi_processing, default: 'true'}
  - arg: {name: cosmos_hoi_base_url, default: 'http://localhost:8010/v1'}
  - arg: {name: cosmos_hoi_model, default: 'cosmos-reason2'}
  - arg: {name: cosmos_hoi_api_key, default: 'EMPTY'}
  - arg: {name: cosmos_hoi_media_root, default: ''}
  - arg: {name: cosmos_hoi_fps, default: '4.0'}
  - arg: {name: cosmos_hoi_enrich_pass1_location, default: 'false'}
  - arg: {name: cosmos_hoi_match_iou_threshold, default: '0.1'}
  - arg: {name: cosmos_hoi_streaming, default: 'false'}
  - arg: {name: enable_semantic_event_post_processing, default: 'true'}
  - arg: {name: semantic_event_output_name, default: 'events_semantic.yaml'}
  - arg: {name: semantic_event_neighbor_window_sec, default: '8.0'}
  - arg: {name: semantic_event_confidence_threshold, default: '0.65'}

  # live demo: rolling recent-history buffer + HTTP bridge (off by default). The
  # mid-run rebuild of events.yaml has no switch of its own: it runs whenever
  # defer_dsg_processing is false and Cosmos HOI is on.
  - arg: {name: enable_live_hoi_query, default: 'false', description: rolling buffer + query bridge}
  - arg: {name: live_buffer_sec, default: '30.0'}
  - arg: {name: live_snapshot_keep, default: '5'}
  - arg: {name: live_bridge_host, default: '0.0.0.0'}
  - arg: {name: live_bridge_port, default: '8100'}
  - arg: {name: enable_live_query_router, default: 'false', description: 'POST /ask picks dsg/interactions/events/video itself'}
  - arg: {name: live_query_router_model, default: '', description: "'' = human_reason.semantic_events.llm_model from pipeline_config"}
  - arg: {name: live_query_router_base_url, default: ''}
  - arg: {name: live_query_router_api_key, default: ''}
  - arg: {name: live_query_router_max_iterations, default: '6', description: 'tool-call round-trips before forcing an answer; lower than the offline default (15) to bound live latency'}
  - arg: {name: live_query_router_tools, default: '', description: 'comma-separated tool names to restrict /ask to; empty = all tools'}
  - arg: {name: event_refresh_interval_sec, default: '120.0', description: 'mid-run events.yaml rebuild interval; only when defer_dsg_processing is false and Cosmos HOI is on'}

  # Node definition
  - node:
      pkg: percorso_perception_ros
      exec: daaam_node.py
      name: daaam
      output: screen
      sigterm_timeout: 300.0 # HOI wait (<=90s/clip x workers) + grounding join (20s) + save + drain
      sigkill_timeout: 360.0
      param:
        # Configuration files
        - {name: pipeline_config, value: $(var pipeline_config)}
        - {name: semantic_config, value: $(var semantic_config)}
        - {name: labelspace_colors, value: $(var labelspace_colors)}

        # ROS2 node parameters
        - {name: depth_scale, value: $(var depth_scale)}
        
        # Model parameters
        - {name: agent_model_name, value: $(var agent_model_name)}
        - {name: sam_model, value: $(var sam_model)}
        - {name: sam_model_config_path, value: $(var sam_model_config_path)}
        - {name: sam_imgsz, value: $(var sam_imgsz)}
        - {name: sentence_embedding_model, value: $(var sentence_embedding_model)}
        - {name: compute_full_image_description, value: $(var compute_full_image_description)}

        # Processing parameters
        - {name: query_interval_frames, value: $(var query_interval_frames)}
        - {name: num_assignment_workers, value: $(var num_assignment_workers)}
        - {name: num_grounding_workers, value: $(var num_grounding_workers)}
        - {name: assignment_worker, value: $(var assignment_worker)}
        - {name: grounding_worker, value: $(var grounding_worker)}
        - {name: min_mask_region_area, value: $(var min_mask_region_area)}
        - {name: defer_dsg_processing, value: $(var defer_dsg_processing)}

        
        # Worker-specific parameters
        - {name: min_obs_per_track, value: $(var min_obs_per_track)}
        - {name: save_debug_data, value: $(var save_debug_data)}
        - {name: multi_image_min_n_masks, value: $(var multi_image_min_n_masks)}
        - {name: save_grounding_images, value: $(var save_grounding_images)}
        - {name: save_plain_grounding_images, value: $(var save_plain_grounding_images)}
        - {name: save_object_images, value: $(var save_object_images)}
        - {name: selectframe_clip_backend, value: $(var selectframe_clip_backend)}
        - {name: selectframe_clip_model_name, value: $(var selectframe_clip_model_name)}
        - {name: cuda_device, value: $(var cuda_device)}

        # Depth filtering
        - {name: depth_lb, value: $(var depth_lb)}
        - {name: depth_ub, value: $(var depth_ub)}

        # Tracking
        - {name: reid_weights, value: $(var reid_weights)}
        - {name: with_reid, value: $(var with_reid)}

        # TF frame configuration
        - {name: world_frame, value: $(var world_frame)}
        - {name: camera_frame, value: $(var camera_frame)}
        
        # Debug and output
        - {name: enable_debug_output, value: $(var enable_debug_output)}
        - {name: output_dir, value: $(var output_dir)}
        - {name: output_run_prefix, value: $(var output_run_prefix)}
        - {name: save_human_clips, value: $(var save_human_clips)}
        - {name: human_clip_detector_weights, value: $(var human_clip_detector_weights)}
        - {name: human_clip_detector_conf, value: $(var human_clip_detector_conf)}
        - {name: human_clip_detector_device, value: $(var human_clip_detector_device)}
        - {name: human_clip_min_frames, value: $(var human_clip_min_frames)}
        - {name: human_clip_max_clip_sec, value: $(var human_clip_max_clip_sec)}
        - {name: human_clip_output_fps, value: $(var human_clip_output_fps)}
        - {name: human_clip_context_sec, value: $(var human_clip_context_sec)}
        - {name: egocentric, value: $(var egocentric)}
        - {name: enable_cosmos_hoi_processing, value: $(var enable_cosmos_hoi_processing)}
        - {name: cosmos_hoi_base_url, value: $(var cosmos_hoi_base_url)}
        - {name: cosmos_hoi_model, value: $(var cosmos_hoi_model)}
        - {name: cosmos_hoi_api_key, value: $(var cosmos_hoi_api_key)}
        - {name: cosmos_hoi_media_root, value: $(var cosmos_hoi_media_root)}
        - {name: cosmos_hoi_fps, value: $(var cosmos_hoi_fps)}
        - {name: cosmos_hoi_enrich_pass1_location, value: $(var cosmos_hoi_enrich_pass1_location)}
        - {name: cosmos_hoi_match_iou_threshold, value: $(var cosmos_hoi_match_iou_threshold)}
        - {name: cosmos_hoi_streaming, value: $(var cosmos_hoi_streaming)}
        - {name: enable_semantic_event_post_processing, value: $(var enable_semantic_event_post_processing)}
        - {name: semantic_event_output_name, value: $(var semantic_event_output_name)}
        - {name: semantic_event_neighbor_window_sec, value: $(var semantic_event_neighbor_window_sec)}
        - {name: semantic_event_confidence_threshold, value: $(var semantic_event_confidence_threshold)}
        - {name: enable_live_hoi_query, value: $(var enable_live_hoi_query)}
        - {name: live_buffer_sec, value: $(var live_buffer_sec)}
        - {name: live_snapshot_keep, value: $(var live_snapshot_keep)}
        - {name: live_bridge_host, value: $(var live_bridge_host)}
        - {name: live_bridge_port, value: $(var live_bridge_port)}
        - {name: enable_live_query_router, value: $(var enable_live_query_router)}
        - {name: live_query_router_model, value: $(var live_query_router_model)}
        - {name: live_query_router_base_url, value: $(var live_query_router_base_url)}
        - {name: live_query_router_api_key, value: $(var live_query_router_api_key)}
        - {name: live_query_router_max_iterations, value: $(var live_query_router_max_iterations)}
        - {name: live_query_router_tools, value: $(var live_query_router_tools)}
        - {name: event_refresh_interval_sec, value: $(var event_refresh_interval_sec)}
      remap:
        - {from: '~/rgb_image', to: $(var rgb_topic)}
        - {from: '~/depth_image', to: $(var depth_topic)}
        - {from: '~/camera_info', to: $(var camera_info_topic)}
        - {from: '~/dsg_updates', to: $(var dsg_update_topic)}
        - {from: '~/label_image', to: $(var segmentation_topic)}
        - {from: '~/colored_label_image', to: $(var segmentation_color_topic)}
