# Launch file for CODa dataset with provided depth images
# Usage: ros2 launch daaam_ros dataloader_coda_with_depth.launch.yaml depth_source:=3d_raw

launch:
  # Arguments
  - arg: {name: framerate, default: '1000.0', description: 'Writing speed in Hz (set high for max speed)'}

  - arg: {name: sequence, default: '0', description: 'CODa sequence to load'}
  - arg: {name: dataset_path, default: '/path/to/coda/data/dir/', description: 'Path to CODa dataset'}
  - arg: {name: camera_ids, default: '[cam0]', description: 'Cameras to load'}

  - arg: {name: bag_path, default: '$(var dataset_path)/coda_$(var sequence)_with_depth.bag', description: 'Output bag path'}
  
  # Frame selection
  - arg: {name: start_frame, default: '0', description: 'Starting frame'}
  - arg: {name: end_frame, default: '-1', description: 'Ending frame (-1 for all)'}
  - arg: {name: stride, default: '1', description: 'Frame stride (overridden by frame_skip if set)'}
  - arg: {name: frame_skip, default: '0', description: 'Frames to skip (0=none, 1=every other, 2=skip 2 of 3)'}
  
  # Depth configuration
  - arg: {name: depth_method, default: 'provided', description: 'Depth method: provided, none'}
  - arg: {name: depth_source, default: '3d_raw_estimated', description: 'Depth source: 3d_raw, 3d_raw_estimated'}
  
  # Visualization
  - arg: {name: enable_visualizer, default: 'false', description: 'Enable Rerun visualization'}
  
  # Bag writer node configured to use provided depth
  - node:
      pkg: 'daaam_ros'
      exec: 'dataloader_node.py'
      name: 'coda_depth_player'
      namespace: 'coda'
      output: 'screen'
      
      param:
        - {name: dataset_type, value: 'coda'}
        - {name: dataset_path, value: $(var dataset_path)}
        - {name: sequence, value: $(var sequence)}
        - {name: camera_ids, value: $(var camera_ids)}
        # Frame selection
        - {name: start_frame, value: $(var start_frame)}
        - {name: end_frame, value: $(var end_frame)}
        - {name: stride, value: $(var stride)}
        - {name: frame_skip, value: $(var frame_skip)}
        # Use provided depth from disk
        - {name: depth_method, value: 'provided'}
        - {name: depth_source, value: $(var depth_source)}
        # Output configuration (bag writing only)
        - {name: bag_path, value: $(var bag_path)}
        - {name: target_framerate, value: $(var framerate)}
        # Other settings
        - {name: auto_start, value: true}
        - {name: enable_visualizer, value: $(var enable_visualizer)}

        # Image resizing configuration
        - {name: resize_images, value: true}
        - {name: target_width, value: 640}
        - {name: target_height, value: 480}
        - {name: resize_method, value: 'crop_resize'}
        - {name: preserve_aspect_ratio, value: true}

      # Topic namespace will be /coda/
      # Topics:
      #   /coda/cam0/rgb_image
      #   /coda/cam0/depth_image (from 3d_raw or 3d_raw_estimated)
      #   /coda/cam0/camera_info
      #   /coda/cam1/rgb_image
      #   /coda/cam1/depth_image (only if 3d_raw_estimated has cam1)
      #   /coda/cam1/camera_info
      #   /tf (for poses)