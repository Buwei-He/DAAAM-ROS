---
launch:
  # development arguments
  - arg: { name: interactive, default: "true" }
  - arg: { name: data_dir, default: "/path/to/data/dir/" }
  - arg: { name: src_dsg, default: "$(var data_dir)/dsg_updated.json" }
  - arg: { name: save_dsg, default: "$(var data_dir)/clustered_dsg.json" }
  - arg: { name: cluster_places_config_path, default: "$(find-pkg-share daaam_ros)/config/cluster_places_config_coda.yaml" }

  - node: {pkg: tf2_ros, exec: static_transform_publisher, args: '--frame-id world --child-frame-id map'}

  # Run.
  - node:
      name: cluster_places
      pkg: hydra_ros
      exec: cluster_places_node
      on_exit: shutdown
      args: >
        --config-utilities-yaml {interactive: $(var interactive), src_path: $(var src_dsg), dst_path: $(var save_dsg)}
        --config-utilities-file $(var cluster_places_config_path)
      remap:
        - { from: cluster_places/dsg, to: hydra_visualizer/dsg }

    # Hydra visualizer
  - include:
      if: $(var interactive)
      file: $(find-pkg-share hydra_visualizer)/launch/streaming_visualizer.launch.yaml
      arg:
        - { name: visualizer_frame, value: world }
        - {
            name: rviz_path,
            value: "$(find-pkg-share daaam_ros)/config/rviz/cluster_places.rviz",
          }
        - {
            name: visualizer_config_path,
            value: "$(find-pkg-share daaam_ros)/config/cluster_places_visualizer_config.yaml",
          }

  # GUI
  - node:
      if: $(var interactive)
      name: cluster_places_gui
      pkg: config_utilities_ros
      exec: gui 
      args: >
        --no-open-browser