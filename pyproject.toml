[build-system]
requires = ["setuptools"]

[build_scripts]
executable = /usr/bin/env python3
[project]
name = "daaam_ros"
authors = [
    {name = "Nicolas Gorlo", email = "ngorlo@mit.edu"}
]
description = "Perception is More than Detection: Spatial Perception and Cognition for Robotics"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Robotics",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dynamic = ["version"]

[project.urls]
Source = "https://github.com/MIT-SPARK/DAAAM-ROS"
Tracker = "https://github.com/MIT-SPARK/DAAAM-ROS/issues"

[tool.setuptools.packages.find]
where = ["src"]
